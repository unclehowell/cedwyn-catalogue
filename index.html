<style>

.th img{width:100%;height:100%;object-fit:cover;display:block}.ph{font-size:30px;line-height:1;opacity:.8}

.gh{max-width:40rem;margin:0 auto;padding:9vh 0 24px;text-align:center}
.glogo{display:inline-block;text-decoration:none;margin:0 0 22px}.glogo small{display:block;color:var(--mut);font-size:15px;letter-spacing:.18em;text-transform:uppercase;margin-top:2px}

.lg{white-space:normal}.lg .lw{display:inline-block;white-space:nowrap} .trend{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 8px;max-width:36rem;margin:14px auto 0;font-size:14px}.trend .trl{color:var(--mut);margin-right:2px}.trend .trc{color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--card)}.trend .trc:hover,.trend .trc:focus-visible{border-color:var(--acc);color:var(--acc)}
.gbtns{display:flex;justify-content:center;gap:12px;margin:16px 0 0}

.gquick{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:26px 0 0}.gquick a{font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--fg);background:var(--card)}

.logo .lg,.glogo .lg{color:var(--fg);font-weight:500;margin:0}

.th.lim{width:92px;height:92px}

.rl{display:block;font-size:12px;margin-top:2px;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.vi{min-width:0}.vth{display:block;position:relative;text-decoration:none}.th.vim{width:100%;height:auto;aspect-ratio:16/9;border-radius:12px}.th.vim img{object-fit:cover}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:20px;line-height:46px;text-align:center;padding-left:3px}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font:600 12px/1 Arial,sans-serif;padding:3px 6px;border-radius:4px}
.vtx{padding:8px 2px 0}.vt{display:block;font-size:15px;line-height:1.3;color:var(--acc);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vs{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.pgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 12px;margin:14px 0}
.th.pim{width:100%;height:auto;aspect-ratio:3/4;border-radius:6px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}.th.pim img{object-fit:cover;object-position:top}
.prev{margin:8px 0;text-align:center}.prev img{max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);background:#fff}.prev figcaption{font-size:13px;color:var(--mut);margin-top:4px}
@media(max-width:480px){.gh{padding-top:5vh}.lg{font-size:28px}.sbar{flex-wrap:wrap;gap:6px}.sbar .logo{width:100%;text-align:center}.sbar .lg{font-size:17px}.sbox .sbtn{padding:9px 12px;font-size:14px}
 .gal{grid-template-columns:repeat(2,1fr)}.th.gim{height:130px}.pgal{grid-template-columns:repeat(2,1fr)}.vgal{grid-template-columns:1fr}.th.lim{width:72px;height:72px}}
.th.vim.vff{aspect-ratio:4/3;background:#e7e5df;border:0}.th.thsk{background:#ecebe6}.th.thsk svg,.vff svg{display:block;width:100%;height:100%}.skfig{margin:8px auto;max-width:420px;text-align:center}.skfig.skfilm{max-width:560px}.skfig svg{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--line);box-shadow:0 1px 6px rgba(0,0,0,.08)}.skfig figcaption{font-size:13px;color:var(--mut);margin-top:6px}.vo{font-size:15px;font-weight:600;margin:26px 0 4px;color:var(--mut)}.uid{font-size:13px;color:var(--mut);margin:6px 0 2px;word-break:break-all}.uid b{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:inherit;letter-spacing:.02em}.nya{color:var(--mut);font-style:italic}.stn{font-size:13px;text-align:center}.unc{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:4px 0}
